# ============================================================
# Cargo.toml - Rustプロジェクトの依存関係定義ファイル
#
# 【このファイルの役割】
# Rustにおけるpackage.jsonに相当。
# プロジェクト名・バージョン・使用するライブラリ（クレート）を宣言する。
# ============================================================
[package]
# プロジェクト名。バイナリ生成時のファイル名になる
name = "apex-team-balancer"
version = "0.1.0"
# Rustのエディション（2021が最新安定版）
edition = "2021"

[dependencies]
# ───────────────────────────────────────────────
# axum: Rustの非同期Webフレームワーク
# features = ["json"] はリクエスト/レスポンスのJSON自動変換を有効化する
# ───────────────────────────────────────────────
axum = { version = "0.7", features = ["json"] }

# ───────────────────────────────────────────────
# tokio: 非同期ランタイム（Rustで非同期処理をするために必須）
# features = ["full"] は全機能（タスク、ファイルIO、ネットワーク等）を有効化
# ───────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ───────────────────────────────────────────────
# serde: シリアライズ/デシリアライズライブラリ
# features = ["derive"] でマクロ（#[derive(Serialize, Deserialize)]）を使えるようにする
# ───────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ───────────────────────────────────────────────
# uuid: ユニークID生成ライブラリ
# features = ["v4"] でランダムUUID（v4形式）を生成できる
# ───────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }

# ───────────────────────────────────────────────
# tower-http: HTTPミドルウェアコレクション
# "cors" - クロスオリジンリソース共有の設定
# "fs"   - 静的ファイル配信（Vueのビルド成果物を配信するために使用）
# ───────────────────────────────────────────────
tower-http = { version = "0.5", features = ["cors", "fs"] }

# ───────────────────────────────────────────────
# tower: Webサービスの抽象化レイヤー（axumの依存関係でもある）
# ───────────────────────────────────────────────
tower = "0.4"

# rand: 乱数生成（チーム分けのランダム性付与に使用）
rand = "0.8"

# ───────────────────────────────────────────────
# tracing / tracing-subscriber: 構造化ログライブラリ
# printlnの代わりに適切なログレベルで出力できる
# ───────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

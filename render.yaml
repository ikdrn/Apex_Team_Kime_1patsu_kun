# ============================================================
# render.yaml - Render.com Blueprint 設定ファイル（修正版 v2）
#
# 【このファイルの役割】
# Render.com の「Blueprint」機能を使ってインフラ構成をコードで管理する。
#
# 【デプロイ手順】
# 1. このリポジトリを GitHub にプッシュする
# 2. Render.com → New → Blueprint
# 3. リポジトリを選択（render.yaml が自動検出される）
# 4. 「Apply」ボタンでデプロイ開始
#
# 【ポート設定について（重要）】
# Render は起動時に PORT 環境変数を自動的にセットする。
# このファイルで port を指定しない場合、Render はデフォルト値（10000）を使い、
# PORT=10000 を環境変数としてセットする。
# Rust コードは std::env::var("PORT") でその値を読み取るため、
# どのポート番号でも正しく動作する。
#
# ⚠️ port: 8080 のようにハードコードすると、Render が PORT=8080 を
# セットして 8080 番にアクセスしようとする。Rust コードが正しく
# PORT 変数を読み取っていれば問題ないが、読み取り失敗時に
# "Connection refused" が発生する原因となる。
# 安全のためここでは port を明示しない。
#
# 【無料プランの制限】
# - 15分非アクティブでスリープする（最初のアクセスに30秒程度かかる）
# - RAM 512MB、CPU 0.1 vCPU
# ============================================================

services:
  - type: web
    name: apex-team-balancer
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free

    # ────────────────────────────────────────────────────────
    # healthCheckPath: Render がデプロイ後にアクセスするヘルスチェックURL
    #
    # このパスに GET リクエストを送り、200 OK が返れば「起動成功」と判断する。
    # /health は Rust サーバーで明示的に実装してある。
    # ────────────────────────────────────────────────────────
    healthCheckPath: /health

    # ────────────────────────────────────────────────────────
    # 環境変数
    # ────────────────────────────────────────────────────────
    envVars:
      # Rust のログレベル
      # info: 通常運用向け（起動ログ、リクエストログ）
      # debug: 問題調査時に詳細なログが出る
      - key: RUST_LOG
        value: info

    # mainブランチへの push で自動デプロイ
    autoDeploy: true
